<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roamly - Travel Planner</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/jpg" href="assets/images/appicon.jpg" />
</head>
<body>
  <header class="navbar">
    <img src="assets/images/appicon.jpg" alt="Roamly Logo" class="logo" />
    <h1>Roamly</h1>
    <img src="assets/images/avatar.jpg" alt="User Avatar" class="avatar" />
  </header>

  <section class="hero">
    <h2>Plan Your Next Adventure</h2>
    <p>Explore stunning destinations and customize your perfect trip.</p>
  </section>

  <section class="destinations">
    <h3>Popular Destinations</h3>
    <div class="destination-grid">
      <div class="destination">
        <img src="assets/images/bali.jpg" alt="Bali" />
        <p>Bali</p>
      </div>
      <div class="destination">
        <img src="assets/images/japan.jpg" alt="Japan" />
        <p>Japan</p>
      </div>
      <div class="destination">
        <img src="assets/images/paris.jpg" alt="Paris" />
        <p>Paris</p>
      </div>
      <div class="destination">
        <img src="assets/images/ireland.jpg" alt="Ireland" />
        <p>Ireland</p>
      </div>
    </div>
  </section>

  <section class="features">
    <h3>Travel Features</h3>
    <div class="feature-icons">
      <div class="feature">
        <img src="assets/svgs/flight.svg" alt="Flights" />
        <p>Book Flights</p>
      </div>
      <div class="feature">
        <img src="assets/svgs/hotel.svg" alt="Hotels" />
        <p>Find Hotels</p>
      </div>
      <div class="feature">
        <img src="assets/svgs/tour.svg" alt="Tours" />
        <p>Plan Tours</p>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2025 Roamly. All rights reserved.</p>
  </footer>
</body>
</html>
